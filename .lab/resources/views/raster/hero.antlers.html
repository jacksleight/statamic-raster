{{ %raster
    basis="700"
    width="1200"
}}
<div class="flex aspect-video flex-col overflow-hidden bg-zinc-950 p-10 text-white {{ raster ? '' : 'rounded-2xl' }}">
    <p class="font-mono text-xs tracking-widest text-emerald-400 uppercase">Statamic Raster Lab</p>
    <h1 class="mt-auto font-serif text-5xl font-semibold tracking-tight text-balance">{{ title }}</h1>
    <p class="mt-3 text-sm text-zinc-400">{{ if date }}{{ date format="j F Y" }}{{ /if }}{{ topics }} &middot; {{ title }}{{ /topics }}</p>
    <p class="mt-6 font-mono text-xs text-zinc-500">{{ raster ? 'Rasterised' : 'Rendered inline, the tag did nothing' }}</p>
</div>
